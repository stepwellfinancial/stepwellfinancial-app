# The Stepwell Financial APP's workflow (app.stepwellfinancial.com).
#
# It publishes only the files named in deploy/RELEASE-FILES.txt, one path per
# line: the app, the Privacy and Terms pages, the 404 page, CNAME and
# robots.txt. Tests, docs, scripts, deploy files, sample market data and
# fixtures are never staged, so they are never published. Runs on every push
# to main, or by hand from the Actions tab.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

# One deploy at a time; never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the same ones as the main site's
# workflow); the release tag is in the comment. To update, look up the new
# tag's commit with git ls-remote and change both.
jobs:
  # Refuses to publish while the release list names a missing or private path,
  # while anything released points outside the list, or while a listed script
  # or stylesheet is loaded by nothing. The deploy job needs this job, so it
  # never runs if this fails. Read-only: no pages or id-token permission.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          persist-credentials: false

      - name: Check the release list
        run: python3 -I scripts/check-release.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          persist-credentials: false

      # Copies the listed paths, and nothing else, into _site. The two files under
      # .github are on the list so the list is complete, but they are never
      # staged: a workflow file is not a page, and no dotfolder is published.
      - name: Stage only the files on the release list
        run: |
          set -euo pipefail
          mkdir _site
          while IFS= read -r rel || [ -n "$rel" ]; do
            [ -z "$rel" ] && continue
            case "$rel" in
              .github/*) continue ;;
              /*|*..*) echo "Refusing the path: $rel"; exit 1 ;;
            esac
            cp -R --parents -- "${rel%/}" _site/
          done < deploy/RELEASE-FILES.txt
          # Nothing private or hidden may have come along.
          if find _site \( -name '.*' -o -path '_site/tests*' -o -path '_site/docs*' -o -path '_site/scripts*' -o -path '_site/deploy*' -o -path '_site/data*' \) | grep -q .; then
            echo "A private or hidden path was staged:"; find _site \( -name '.*' -o -path '_site/tests*' -o -path '_site/docs*' -o -path '_site/scripts*' -o -path '_site/deploy*' -o -path '_site/data*' \)
            exit 1
          fi
          test "$(cat _site/CNAME)" = "app.stepwellfinancial.com"
          find _site -type f | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0 (= v5)

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (= v3)
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (= v4)
