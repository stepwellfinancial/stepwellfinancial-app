# The Stepwell Financial APP's workflow (app.stepwellfinancial.com).
#
# The public repository holds only the released files (the paths in the
# private repository's deploy/RELEASE-FILES.txt, checked there with
# scripts/check-release.py before each release commit): the app, the Privacy
# and Terms pages, the 404 page, CNAME and robots.txt. This workflow publishes
# every tracked file except .github, and refuses to publish if a test, doc,
# script, deploy, data or hidden path is present, so it cannot publish the
# private repository. Runs on every push to main, or by hand from the Actions tab.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

# One deploy at a time; never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the same ones as the main site's
# workflow); the release tag is in the comment. To update, look up the new
# tag's commit with git ls-remote and change both.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (= v4)
        with:
          persist-credentials: false

      # Copies the tracked files, and nothing else, into _site. The two files under
      # .github are never staged: a workflow file is not a page, and no
      # dotfolder is published.
      - name: Stage only the tracked release files
        run: |
          set -euo pipefail
          mkdir _site
          git ls-files -z | while IFS= read -r -d '' rel; do
            case "$rel" in
              .github/*) continue ;;
              /*|*..*) echo "Refusing the path: $rel"; exit 1 ;;
            esac
            cp --parents -- "$rel" _site/
          done
          # Nothing private or hidden may have come along.
          if find _site \( -name '.*' -o -path '_site/tests*' -o -path '_site/docs*' -o -path '_site/scripts*' -o -path '_site/deploy*' -o -path '_site/data*' \) | grep -q .; then
            echo "A private or hidden path was staged:"; find _site \( -name '.*' -o -path '_site/tests*' -o -path '_site/docs*' -o -path '_site/scripts*' -o -path '_site/deploy*' -o -path '_site/data*' \)
            exit 1
          fi
          test "$(cat _site/CNAME)" = "app.stepwellfinancial.com"
          find _site -type f | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0 (= v5)

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (= v3)
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (= v4)
